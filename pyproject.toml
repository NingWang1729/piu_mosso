# pyproject.toml configures the build and MANIFEST.in adds files to the sdist; setuptools 77 reads the SPDX
# license string below
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "piu_mosso"
version = "0.2.0"
description = "Fast single-cell utilities: FAISS nearest neighbours, a fast UMAP and Seurat v3 highly variable genes"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Ning Wang"}]
dependencies = [
    "anndata",
    # faiss-cpu and faiss-gpu-cu12 both install the module `faiss`, so they cannot share an environment;
    # the README says how to swap in faiss-gpu-cu12
    "faiss-cpu",
    "numpy",
    "pandas",
    "scikit-learn",
    "scikit-misc",  # LOESS for Seurat v3 highly variable genes
    "scipy",
    # umap-learn 0.6 changed the defaults of its low-level layout functions (Adam optimizer)
    "umap-learn>=0.5.12,<0.6",
]
keywords = ["single-cell", "scanpy", "anndata", "nearest neighbours", "faiss", "umap", "highly variable genes"]
# No "License ::" classifier: setuptools 77 refuses one next to the SPDX license expression above (PEP 639)
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/NingWang1729/piu_mosso"
Repository = "https://github.com/NingWang1729/piu_mosso"
Issues = "https://github.com/NingWang1729/piu_mosso/issues"
Changelog = "https://github.com/NingWang1729/piu_mosso/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# CuPy for the GPU UMAP (use_gpu=True), one extra per CUDA major version; cupy-cuda12x and cupy-cuda13x both install
# the module `cupy`, so install only one. [ctk] brings CUDA's runtime libraries (the kernel is compiled with NVRTC).
cuda12 = ["cupy-cuda12x[ctk]>=14"]
cuda13 = ["cupy-cuda13x[ctk]>=14"]
# The tests compare piu_mosso with scanpy
test = ["pytest", "scanpy"]

[tool.setuptools.packages.find]
where = ["src"]
